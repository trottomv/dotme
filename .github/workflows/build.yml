name: Zola build

on:
  push:
    branches:
    - stage
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Check
      run: docker run --rm -u "$(id -u):$(id -g)" -v $PWD:/app --workdir /app ghcr.io/getzola/zola:v0.22.1 check
    - name: Build
      run: docker run --rm -u "$(id -u):$(id -g)" -v $PWD:/app --workdir /app ghcr.io/getzola/zola:v0.22.1 build --force --output-dir docs
    - name: Push build
      run: |
        git config --global --add safe.directory "*"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        git config --global github.token ${{ secrets.GITHUB_TOKEN }}
        git commit -a -m "Build ${{ github.ref_name }}" || true
        git push origin ${{ github.ref_name }}
